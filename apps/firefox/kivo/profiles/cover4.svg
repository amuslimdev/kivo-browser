<path d="M0 420c120-90 260-90 380 0s240 70 420-10V544H0z" fill="#fff" opacity=".14"/>
<path d="M0 480c160-70 300-60 440 10s260 40 360-20V544H0z" fill="#fff" opacity=".2"/>
