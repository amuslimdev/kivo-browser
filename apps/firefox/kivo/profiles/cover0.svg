<!-- Kivo profile card cover (sky): context-fill is the profile color, context-stroke the color on it. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 544">
<defs><linearGradient id="shade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".16"/></linearGradient></defs>
<rect width="800" height="544" fill="context-fill"/>
<g fill="#fff" opacity=".2"><circle cx="70" cy="500" r="120"/><circle cx="210" cy="540" r="110"/><circle cx="160" cy="430" r="80"/><circle cx="330" cy="560" r="80"/></g>
<g fill="#fff" opacity=".16"><circle cx="720" cy="40" r="120"/><circle cx="590" cy="0" r="90"/><circle cx="640" cy="100" r="70"/></g>
<path d="M560 420c40-46 80-46 110 0s70 46 110 0" fill="none" stroke="context-stroke" stroke-opacity=".4" stroke-width="12" stroke-linecap="round"/>
<path d="M40 110c34-36 68-36 96 0s62 36 96 0" fill="none" stroke="context-stroke" stroke-opacity=".3" stroke-width="10" stroke-linecap="round"/>
<rect width="800" height="544" fill="url(#shade)"/>
</svg>
